</head><body><h1>Voidrunner: Frontier: the story</h1>
<figure><a href="01-cover.png"><img src="01-cover.png" alt="Cover" loading="lazy"></a><figcaption><b>Cover</b> You are a freelance pilot with a paid-off starter ship, a hangar berth at Halvar Station on the edge of charted space, and no debts to anyone. Where the Concord's patrols thin out, haulers, ore crews, pirates and scientists all need somebody with a ship and no allegiance, and nobody hands you a destination: you close in on whatever signal is nearest and decide what it is worth. Every lane you make safe fills with traffic, every base you burn stays burned, every station keeps a ledger with your name in it, and somewhere past the last listening station a signal keeps repeating a docking request to a station that was never built.</figcaption></figure>
<figure><a href="02-intro.png"><img src="02-intro.png" alt="Intro" loading="lazy"></a><figcaption><b>Intro</b> One secondhand ship, a half tank of fuel, and a strip of charted stars that ends where you decide to keep going.</figcaption></figure>
<figure><a href="03-lane-raid.png"><img src="03-lane-raid.png" alt="lane-raid: Raid on the Belt Lane" loading="lazy"></a><figcaption><b>lane-raid: Raid on the Belt Lane</b> A Guild hauler running food to Halvar drops out of supercruise in the belt and three Syndicate scouts are on it before its shields are up; its distress call reaches every ship in the system. Patrol is two minutes away, which is one minute too many. *Where:* The Halvar belt lane, dense rock between the station and the ice refinery. *Player:* Flies in close and picks a side under fire: shoots the scouts off the hauler, joins the pirates and splits the cargo, or hangs back among the rocks and salvages whatever is left when it is over.. *Stakes:* A dead hauler means Halvar's food price spikes and the Guild remembers who did nothing; a starter ship that lingers in the crossfire loses its hull in seconds; firing on the hauler marks you with the Concord patrol watching. Scouts here are light and break off when one of them dies, so a cautious pilot can win this fight with a stock ship.</figcaption></figure>
<figure><a href="04-first-ore.png"><img src="04-first-ore.png" alt="first-ore: Ore for the Refinery" loading="lazy"></a><figcaption><b>first-ore: Ore for the Refinery</b> The ice refinery is short of iron and Mbatha has a standing buy order that also tops up the tank of any ship that delivers; the outer belt is common rock, but the scanner shows a platinum seam deep in the dense core where the asteroids tumble too close together to fly fast. *Where:* The Halvar belt, outer rocks and the dense core. *Player:* Flies into the belt, scans rocks to tell iron from platinum, holds position and cuts with the mining laser until the hold is full, then threads back out with a heavy ship that no longer turns the way it did and sells at the refinery or hauls it home to the hangar store.. *Stakes:* A loaded hull collides harder; scouts pick off miners heading home; filling the hold with iron means leaving the platinum, and the buy order's price falls once the Union crew sells first. The outer rocks are safe and always pay something, so a first run never comes home empty.</figcaption></figure>
<figure><a href="05-false-beacon.png"><img src="05-false-beacon.png" alt="false-beacon: The Beacon That Lies" loading="lazy"></a><figcaption><b>false-beacon: The Beacon That Lies</b> A civilian distress beacon lights up in an empty pocket of the belt. More often than not it is a stranded miner with a dead reactor who pays well for a tow; sometimes it is a Syndicate lure with interceptors parked behind the nearest rock. *Where:* An empty pocket of the Halvar belt, off the lane. *Player:* Drops out of supercruise at range, scans the signal source before closing in, then either tows the miner home to Halvar, fights clear of the ambush, or boosts back into supercruise before the interceptors reach lock.. *Stakes:* Closing blind into an ambush costs the ship; ignoring a real miner costs reputation with the Outposts and a rescue fee; a Greyline crew will claim the salvage and fire if you argue. A scan at range always tells the truth, so the trap only catches the impatient.</figcaption></figure>
<figure><a href="06-union-strike.png"><img src="06-union-strike.png" alt="union-strike: The Ore Stoppage" loading="lazy"></a><figcaption><b>union-strike: The Ore Stoppage</b> The Ore Union has stopped selling to Guild haulers over a price dispute; ore piles up at the colonies, machinery runs out, and the Concord posts an inspection beacon on the lane to keep Greyline from running the blockade for either side. *Where:* The Emberfall lane between the Union mining colony and the Guild depot, with Rhee's checkpoint beacon in the middle. *Player:* Loads cargo at one end and flies it through the checkpoint: declares it and pays the tariff, cuts drives and submits to a scan with contraband hidden in a shielded hold, or runs the beacon at full boost with a corvette on the tail.. *Stakes:* A seized cargo is credits gone and a Concord fine; breaking the blockade for the Guild drops Union reputation and closes the colony's cheap ore; running the checkpoint earns a bounty on your own hull. Declared legal cargo passes clean every time, and the stoppage makes even honest machinery runs pay double.</figcaption></figure>
<figure><a href="07-radiation-dive.png"><img src="07-radiation-dive.png" alt="radiation-dive: Crystals in the Corona Band" loading="lazy"></a><figcaption><b>radiation-dive: Crystals in the Corona Band</b> Rare uranium crystals form only in the band of asteroids closest to Emberfall, where radiation cooks hulls in minutes; the Lantern station and the Syndicate both pay triple for them, and nobody else is fool enough to go. *Where:* The inner asteroid band around the red giant Emberfall. *Player:* Times a dive into the radiation band, scans fast for a crystal-bearing rock, cuts with the laser while the hull counter runs down, and pulls out before shields fail, deciding whether to tow the drifting Syndicate miner out on the way.. *Stakes:* One miscounted minute and the ship cooks; a full hold of crystals is a fortune at two stations that hate each other; towing the pirate out earns Syndicate credit and a Concord question later.</figcaption></figure>
<figure><a href="08-wanted-hauler.png"><img src="08-wanted-hauler.png" alt="wanted-hauler: The Captain Who Kept the Cargo" loading="lazy"></a><figcaption><b>wanted-hauler: The Captain Who Kept the Cargo</b> A Union hauler captain took a Guild machinery shipment and hid in the ice system's rings; the Concord has posted a bounty, the Guild wants the cargo back, and the Union colony is quietly paying anyone who will escort him somewhere the patrol won't look. *Where:* The ice rings of the Emberfall system's frozen outer planet. *Player:* Scans the rings to find the hauler's drive signature, then hunts it for the bounty, escorts it through the hunters to a Union colony, or buys its cargo at a discount and sells it back to the Guild.. *Stakes:* The bounty hunter fires on whoever is nearest the target; escorting a wanted ship makes you wanted; the machinery cargo is heavy enough that a loaded ship cannot outrun the hunters.</figcaption></figure>
<figure><a href="09-fog-market.png"><img src="09-fog-market.png" alt="fog-market: Finding Greaves's Hold" loading="lazy"></a><figcaption><b>fog-market: Finding Greaves's Hold</b> A Syndicate contact at a pirate-system bar sells the first beacon coordinate into the nebula; the station is reachable only by following the beacons one at a time through fog where the scanner cannot see the rock ahead. *Where:* The Blackreach nebula and the hidden Syndicate station at its centre. *Player:* Flies beacon to beacon at low speed through the nebula, scanning for the next one and dodging unseen rock, answering the interceptors' challenge with enough Syndicate reputation to dock or enough speed to survive, then trades on the illegal market inside.. *Stakes:* A wrong beacon ends in a dead-end of rock and an interceptor pack; docking here is logged if a Concord scout sees you; the lost courier's cargo is worth a lot, and the courier is worth more to the Guild alive. Once found, the beacon chain stays on your map and the trip in is a quiet one.</figcaption></figure>
<figure><a href="10-base-assault.png"><img src="10-base-assault.png" alt="base-assault: The Hold Must Burn" loading="lazy"></a><figcaption><b>base-assault: The Hold Must Burn</b> Rhee, Greyline and the Guild all post contracts on the Syndicate station once someone sells its coordinates; a strike on the base must take its sensor array first, before its cruiser can lock and its interceptors can see through the fog. *Where:* The Syndicate station and its defence ring inside the nebula. *Player:* Closes in on the station's sensor subsystem under fire, knocks it out, then picks off engines and turrets on the cruiser before the reinforcements arrive, or sells the strike's timing to Greaves and fights the attackers from the station's side.. *Stakes:* The station stays destroyed forever: Syndicate raids on the Halvar lane drop, hauler traffic rises, station prices settle, and the Syndicate's illegal market and its missions are gone for good; betraying the strike makes every Concord beacon hostile.</figcaption></figure>
<figure><a href="11-weapons-run.png"><img src="11-weapons-run.png" alt="weapons-run: Guns Through the Checkpoint" loading="lazy"></a><figcaption><b>weapons-run: Guns Through the Checkpoint</b> Greaves offers a fat contract to carry a weapons crate from a pirate system to the Hold, through a Concord checkpoint that scans every hull, with a Syndicate escort that will abandon you the moment the patrol locks. *Where:* The lane from the pirate system through Rhee's checkpoint beacon into the Blackreach. *Player:* Flies the lane with the crate aboard, choosing to pay a bribe at the beacon, run it at boost, or jettison the cargo and recover it after the inspection with the scanner.. *Stakes:* Caught means a Concord bounty and the escort fleeing; jettisoned cargo drifts and can be picked up by anyone who scans it first; a delivered crate arms the raids you may later be hired to stop.</figcaption></figure>
<figure><a href="12-dead-station.png"><img src="12-dead-station.png" alt="dead-station: The Automated Station" loading="lazy"></a><figcaption><b>dead-station: The Automated Station</b> An unknown signal resolves to an abandoned mining station still running on a dying reactor; its holds are full, its docking collar still works, and its defence drones still think everything is a thief. *Where:* A derelict mining station in an abandoned red-dwarf system. *Player:* Scans the station to find which subsystems are live, disables the drone bay or slips past it along the hull, salvages modules and cargo from the holds, and decides how much to leave when Greyline shows up.. *Stakes:* A hold full of salvaged modules is worth a new ship, but the drones hit hard and Greyline will fight over the claim; the dying reactor is on its own clock and the station can go with you docked to it. Some derelicts out here have no drones at all and are simply a gift to whoever scans them first.</figcaption></figure>
<figure><a href="13-the-signal.png"><img src="13-the-signal.png" alt="the-signal: Triangulating the Signal" loading="lazy"></a><figcaption><b>the-signal: Triangulating the Signal</b> Dr. Ulo pays for anomaly readings: each gravitational anomaly scanned up close gives one bearing on the transmission, and each bearing strikes systems off the chart until only one is left, a system no galaxy map shows and no fuel seller is anywhere near. *Where:* A chain of anomalies in the abandoned systems beyond the Lantern listening station. *Player:* Flies to each anomaly, holds the ship steady against gravity that pulls it off course while the scanner completes, carries the readings back or onward, and chooses whether to sell them to Ulo, to Greyline, or keep them until the source's coordinates resolve on the map.. *Stakes:* The anomaly tears hull off a ship that drifts too close; running out of fuel in the Deep is a long tow or the end of the ship; the Greyline frigate will take the readings by force if it catches you with them, and whoever holds the last bearing is the first to the source.</figcaption></figure>
<figure><a href="14-wormhole.png"><img src="14-wormhole.png" alt="wormhole: The Hole in the Chart" loading="lazy"></a><figcaption><b>wormhole: The Hole in the Chart</b> The last bearing resolves to the Long Meridian, a colony seed-ship adrift in an uncharted system, holds intact, drives long dead, still asking a station that never existed for permission to dock; the gravitational wake of its last jump is a stable wormhole, visible only to a ship that has already scanned the Meridian, leading to a sector no one on the galaxy map has visited. *Where:* The Long Meridian's uncharted system at the edge of the Deep, and the unexplored sector beyond the wormhole. *Player:* Docks with the Meridian and salvages its seed-vault of exotic matter and the one drive module no shipyard sells, answers or silences its docking request, then flies through the wormhole with a full tank and a hold of fuel cells, scans the first unknown system on the other side, bookmarks it, and decides whether to sell the route, keep it, or keep going.. *Stakes:* A one-way trip if fuel runs out; the first pilot to chart a system owns the discovery in the codex and the first prices there; a sold route brings every faction through the hole behind you, and selling the Meridian's coordinates means Greyline strips it before you return.</figcaption></figure>
