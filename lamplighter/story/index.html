</head><body><h1>Lamplighter: the story</h1>
<figure><a href="01-cover.jpg"><img src="01-cover.jpg" alt="Cover" loading="lazy"></a><figcaption><b>Cover</b> Reedmoor is a marsh village where oil lamps are the only fire the law allows. Wren is its lamplighter. Every dusk she lights the village's five lamps and keeps them burning until the dawn bell, because the marsh wisps come for any light left alone, and a dark village is one the marsh takes back. This is the stretch of nights before Kindling, before Wren ever held a spark of her own.</figcaption></figure>
<figure><a href="02-m1.jpg"><img src="02-m1.jpg" alt="M1" loading="lazy"></a><figcaption><b>M1</b> one night: learn the round</figcaption></figure>
<figure><a href="03-m2.jpg"><img src="03-m2.jpg" alt="M2" loading="lazy"></a><figcaption><b>M2</b> three nights; each villager asks for one small thing</figcaption></figure>
<figure><a href="04-m3.jpg"><img src="04-m3.jpg" alt="M3" loading="lazy"></a><figcaption><b>M3</b> the last night, a wisp storm; the dawn bell rings over one surviving lamp, and a stray spark settles in Wren's hand (Kindling begins)</figcaption></figure>
